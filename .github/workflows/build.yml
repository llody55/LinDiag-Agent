name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install dependencies
        run: |
          go mod tidy

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          BINARY_NAME="lindiag-agent"
          if [ "$GOOS" = "windows" ]; then
            BINARY_NAME="lindiag-agent.exe"
          fi

          LDFLAGS="-s -w"
          # Linux 静态链接，Windows 跳过 -extldflags
          if [ "$GOOS" = "linux" ]; then
            LDFLAGS="${LDFLAGS} -extldflags '-static'"
          fi

          VERSION=${GITHUB_REF_NAME}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="${LDFLAGS} -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${BUILD_DATE}"

          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="${LDFLAGS}" \
            -o "${BINARY_NAME}" \
            ./cmd/agent

          RELEASE_NAME="lindiag-agent-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            mv "${BINARY_NAME}" "${RELEASE_NAME}.exe"
            sha256sum "${RELEASE_NAME}.exe" > "${RELEASE_NAME}.exe.sha256"
          else
            mv "${BINARY_NAME}" "${RELEASE_NAME}"
            sha256sum "${RELEASE_NAME}" > "${RELEASE_NAME}.sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lindiag-agent-${{ matrix.os }}-${{ matrix.arch }}
          path: lindiag-agent-*

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: Create combined checksums file
        run: |
          cd ./dist
          cat *.sha256 > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist/lindiag-agent-*
            ./dist/checksums.txt
          body: |
            ## LinDiag-Agent ${{ github.ref_name }}

            ### 下载

            | 平台 | 文件 |
            |------|------|
            | Linux amd64 | `lindiag-agent-linux-amd64` |
            | Linux arm64 | `lindiag-agent-linux-arm64` |
            | Windows amd64 | `lindiag-agent-windows-amd64.exe` |

            ### 校验

            下载 `checksums.txt`，在同目录执行：
            ```bash
            sha256sum -c checksums.txt --ignore-missing
            ```

            完整变更见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)。
          draft: false
          prerelease: false
